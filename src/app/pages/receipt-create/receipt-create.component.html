<section class="receipt-form">
  <header class="receipt-header">
    <a class="back-link" routerLink="/menu">Retour</a>
    <h1>Nouveau reçu</h1>
    <p>Sélectionnez un donateur ou créez-en un nouveau.</p>
  </header>

  <form class="form-card" (ngSubmit)="submit()">
    <div class="block">
      <h2>Donateur</h2>
      <label class="checkbox">
        <input type="checkbox" name="useExisting" [(ngModel)]="useExistingDonator" (change)="onExistingToggle()" />
        <span>Donateur existant</span>
      </label>

      <div class="select-row" *ngIf="useExistingDonator">
        <label class="field">
          <span>Sélection du donateur <span class="required-indicator">*</span></span>
          <div class="search-select">
            <input
              type="text"
              name="donatorSearch"
              placeholder="Nom ou société"
              [(ngModel)]="filterText"
              (input)="onDonatorInput()"
              (focus)="openDonatorDropdown()"
              (blur)="closeDonatorDropdown()"
              [disabled]="isLoadingDonators"
              autocomplete="off"
            />
            <span class="search-caret" aria-hidden="true"></span>
            <div class="search-dropdown" *ngIf="showDonatorDropdown">
              <button
                type="button"
                class="search-option"
                *ngFor="let donator of filteredDonators"
                (mousedown)="selectDonatorOption(donator)"
              >
                {{ donator.companyName || (donator.firstName + ' ' + donator.lastName) }}
              </button>
              <div class="search-empty" *ngIf="filteredDonators.length === 0">
                Aucun donateur trouvé.
              </div>
            </div>
          </div>
        </label>
        <p class="helper" *ngIf="isLoadingDonators">Chargement des donateurs...</p>
        <p class="field-error" *ngIf="submitAttempted && !selectedDonatorId">
          Veuillez selectionner un donateur.
        </p>
      </div>

      <div class="form-grid" *ngIf="!useExistingDonator">
        <label class="field">
          <span>Nom</span>
          <input type="text" name="lastName" placeholder="Nom" [(ngModel)]="donatorModel.lastName" />
        </label>

        <label class="field">
          <span>Prenom</span>
          <input type="text" name="firstName" placeholder="Prenom" [(ngModel)]="donatorModel.firstName" />
        </label>

        <div class="divider divider-full">OU</div>

        <label class="field field-wide">
          <span>Nom de société</span>
          <input type="text" name="companyName" placeholder="Société" [(ngModel)]="donatorModel.companyName" />
        </label>

        <div class="section-separator"></div>

        <label class="field field-wide">
          <span>Adresse ligne 1</span>
          <input type="text" name="address" placeholder="Adresse" [(ngModel)]="donatorModel.address" />
        </label>

        <label class="field">
          <span>Ville</span>
          <input type="text" name="city" placeholder="Ville" [(ngModel)]="donatorModel.city" />
        </label>

        <label class="field">
          <span>Code postal</span>
          <input
            type="text"
            name="postalCode"
            placeholder="Code postal"
            inputmode="numeric"
            pattern="\d+"
            minlength="5"
            maxlength="10"
            [(ngModel)]="donatorModel.postalCode"
            (input)="onPostalCodeInput($event.target.value)"
          />
        </label>

        <label class="field">
          <span>Pays</span>
          <input type="text" name="country" placeholder="Pays" [(ngModel)]="donatorModel.country" disabled />
        </label>

        <label class="field field-wide">
          <span>Email</span>
          <input type="email" name="email" placeholder="Email" [(ngModel)]="donatorModel.email" />
        </label>
      </div>
    </div>

    <div class="block">
      <h2>Reçu</h2>
      <div class="form-grid">
        <label class="field">
          <span>Montant en chiffre <span class="required-indicator">*</span></span>
          <div class="amount-input">
            <input
              type="number"
              name="amountInput"
              placeholder="0,00"
              min="0.01"
              step="0.01"
              required
              [(ngModel)]="receiptModel.amountInput"
              #amountModel="ngModel"
            />
            <span class="amount-suffix">€</span>
          </div>
          <p class="field-error" *ngIf="submitAttempted && amountModel.invalid">
            Montant obligatoire.
          </p>
        </label>

        <label class="field field-wide">
          <span>Montant en toutes lettres</span>
          <input type="text" name="amountWords" [value]="amountWords" readonly />
        </label>

        <label class="field field-wide">
          <span>Motif du don</span>
          <input 
          type="text" 
          name="subject" 
          [(ngModel)]="receiptModel.subject"
          placeholder="Motif du don"
          required
          #subjectModel="ngModel"
          />
          <p class="field-error" *ngIf="submitAttempted && subjectModel.invalid">
            Motif du don obligatoire.
          </p>
        </label>
        

        <label class="field">
          <span>Date du don <span class="required-indicator">*</span></span>
          <input
            type="date"
            name="donationDate"
            [(ngModel)]="receiptModel.donationDate"
            required
            #donationDateModel="ngModel"
          />
          <p class="field-error" *ngIf="submitAttempted && donationDateModel.invalid">
            Date obligatoire.
          </p>
        </label>

        <label class="field">
          <span>Méthode de paiement <span class="required-indicator">*</span></span>
          <select
            name="paymentMethod"
            [(ngModel)]="receiptModel.paymentMethod"
            required
            #paymentMethodModel="ngModel"
          >
            <option value="" disabled>Choisir un mode</option>
            <option *ngFor="let method of paymentMethods" [value]="method.value">{{ method.label }}</option>
          </select>
          <p class="field-error" *ngIf="submitAttempted && paymentMethodModel.invalid">
            Mode de paiement obligatoire.
          </p>
        </label>
      </div>
    </div>

    <div class="form-actions">
      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button
        class="primary-btn"
        type="submit"
        [disabled]="isSubmitting || isLoadingDonators"
        [class.is-disabled]="!canSubmit"
      >
        {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer le reçu' }}
      </button>
    </div>

    <div class="action-card" *ngIf="postCreateAction">
      <div class="action-header">
        <h3>Recu cree</h3>
        <p>Que voulez-vous faire maintenant ?</p>
      </div>

      <label class="field">
        <span>Email pour envoi</span>
        <input
          type="email"
          name="actionEmail"
          placeholder="adresse@email.com"
          [(ngModel)]="actionEmail"
        />
      </label>
      <p class="field-error" *ngIf="actionErrorMessage">{{ actionErrorMessage }}</p>

      <div class="action-row">
        <button type="button" class="secondary-btn" (click)="downloadCreatedReceipt()">
          Telecharger le recu
        </button>
        <button
          type="button"
          class="primary-btn"
          (click)="sendCreatedReceipt()"
          [disabled]="isSendingEmail"
        >
          {{ isSendingEmail ? 'Envoi...' : 'Envoyer par email' }}
        </button>
        <button type="button" class="ghost-btn" (click)="skipPostCreateAction()">
          Ignorer
        </button>
      </div>
    </div>
  </form>
</section>
