<section class="donator-form">
  <header class="donator-header">
    <a class="back-link" routerLink="/menu">Retour</a>
    <h1>Nouveau donateur</h1>
    <p>Choisissez soit nom et prenom, soit nom de societe.</p>
  </header>

  <form class="form-card" (ngSubmit)="submit()">
    <div class="form-grid">
      <label class="field">
        <span>Nom</span>
        <input type="text" name="lastName" placeholder="Nom" [(ngModel)]="model.lastName" />
      </label>

      <label class="field">
        <span>Prenom</span>
        <input type="text" name="firstName" placeholder="Prenom" [(ngModel)]="model.firstName" />
      </label>

      <div class="divider">OU</div>

      <label class="field">
        <span>Nom de societe</span>
        <input type="text" name="companyName" placeholder="Societe" [(ngModel)]="model.companyName" />
      </label>

      <div class="section-separator"></div>

      <label class="field field-wide">
        <span>Adresse ligne 1</span>
        <input type="text" name="address" placeholder="Adresse" [(ngModel)]="model.address" />
      </label>

      <label class="field">
        <span>Ville</span>
        <input type="text" name="city" placeholder="Ville" [(ngModel)]="model.city" />
      </label>

      <label class="field">
        <span>Code postal</span>
        <input type="text" name="postalCode" placeholder="Code postal" [(ngModel)]="model.postalCode" />
      </label>

      <label class="field">
        <span>Pays</span>
        <input type="text" name="country" placeholder="Pays" [(ngModel)]="model.country" />
      </label>
    </div>

    <div class="form-actions">
      <p class="helper" [class.error]="hasModeConflict">
        {{ hasModeConflict ? 'Choisissez soit une personne, soit une societe.' : 'Tous les champs restants sont optionnels.' }}
      </p>
      <button class="primary-btn" type="submit" [disabled]="!canSubmit">Enregistrer</button>
    </div>
  </form>
</section>
